<!doctype html>
<!--
  Hand-built fixture representative of a custom storefront with no
  structured data — extraction has to fall back to heuristics. Not a
  capture of a real site — see docs/SPEC_REVIEW.md, §2.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Nomad Supply Co.</title>
    <meta name="description" content="Sacs et accessoires de voyage minimalistes." />
    <meta property="og:image" content="assets/social-preview.jpg" />
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        font-family: Helvetica, sans-serif;
      }
      h1 {
        font-family: "Futura", sans-serif;
      }
      nav {
        padding: 20px;
      }
      section {
        padding: 40px;
      }
      .add-to-cart {
        background: #2e7d32;
        color: #ffffff;
        border: none;
        padding: 14px 28px;
      }
    </style>
  </head>
  <body>
    <nav>
      <img src="assets/nomad-hero.jpg" alt="Nomad banner" />
    </nav>
    <section>
      <h1>Voyage leger</h1>
      <p>Concu pour durer, pense pour l'essentiel.</p>
      <button class="add-to-cart">Ajouter au panier</button>
    </section>
  </body>
</html>
