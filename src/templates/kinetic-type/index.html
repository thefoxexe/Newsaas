<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="stage">
      <div class="brand-badge" id="brand-badge">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-name" id="brand-name"></span>
      </div>
      <div class="eyebrow" id="eyebrow"><span class="eyebrow-label" id="eyebrow-label"></span></div>
      <div class="hook" id="hook"></div>
      <div class="body-lines" id="body"></div>
      <div class="cta" id="cta">
        <span class="cta-text" id="cta-text"></span>
        <div class="brand-badge" id="brand-badge-outro">
          <span class="brand-mark" id="brand-mark-outro"></span>
          <span class="brand-name" id="brand-name-outro"></span>
        </div>
      </div>
    </div>
    <script id="reeljolt-data" type="application/json">__REELJOLT_DATA__</script>
    <script>
      (function () {
        var data = JSON.parse(document.getElementById("reeljolt-data").textContent);
        var root = document.documentElement;
        root.style.setProperty("--color-primary", data.colors.primary);
        root.style.setProperty("--color-background", data.colors.background);
        root.style.setProperty("--color-text", data.colors.text);
        root.style.setProperty(
          "--font-heading",
          "'" + data.typography.headingFamily + "', " + data.typography.fallbackStack,
        );
        root.style.setProperty(
          "--font-body",
          "'" + data.typography.bodyFamily + "', " + data.typography.fallbackStack,
        );

        function fillBrandMark(markEl, nameEl) {
          if (data.logoUrl) {
            var img = document.createElement("img");
            img.src = data.logoUrl;
            markEl.appendChild(img);
          } else {
            markEl.textContent = data.brandName.charAt(0).toUpperCase();
          }
          nameEl.textContent = data.brandName;
        }

        fillBrandMark(document.getElementById("brand-mark"), document.getElementById("brand-name"));
        fillBrandMark(document.getElementById("brand-mark-outro"), document.getElementById("brand-name-outro"));

        document.getElementById("eyebrow-label").textContent = data.angle;

        var hookEl = document.getElementById("hook");
        data.hook.split(" ").forEach(function (word) {
          var span = document.createElement("span");
          span.className = "word";
          span.textContent = word;
          hookEl.appendChild(span);
        });

        var bodyEl = document.getElementById("body");
        data.body.forEach(function (line) {
          var p = document.createElement("p");
          p.className = "body-line";
          p.textContent = line;
          bodyEl.appendChild(p);
        });

        document.getElementById("cta-text").textContent = data.cta;

        // Every Animation starts in its "before" phase immediately, so pausing
        // here (before any paint) and later seeking currentTime is enough to
        // capture any point in the timeline deterministically.
        document.getAnimations().forEach(function (animation) {
          animation.pause();
        });

        window.__reeljoltSeek = function (ms) {
          document.getAnimations().forEach(function (animation) {
            animation.currentTime = ms;
          });
        };
        window.__reeljoltReady = true;
      })();
    </script>
  </body>
</html>
